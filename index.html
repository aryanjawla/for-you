<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>For Vane ❤️</title>
<style>
  :root{--bg:#0f1724;--card:#0b2447;--accent:#ff6b6b;--p:#cbd5e1;}
  html,body{height:100%;margin:0;font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;}
  body{
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 10% 20%, rgba(255,107,107,0.08), transparent 8%),
               radial-gradient(circle at 90% 80%, rgba(99,102,241,0.06), transparent 8%),
               var(--bg);color:var(--p);
  }
  .card{
    width:min(880px,94vw);
    background:rgba(255,255,255,0.03);
    border-radius:18px;padding:36px;
    box-shadow:0 10px 30px rgba(2,6,23,0.6);
    border:1px solid rgba(255,255,255,0.04);
  }
  h1{
    margin:0;font-size:clamp(28px,4vw,44px);
    background:linear-gradient(90deg,var(--accent),#b28cff);
    -webkit-background-clip:text;color:transparent;
  }
  .message{
    margin-top:14px;background:rgba(255,255,255,0.05);
    padding:14px;border-radius:10px;color:var(--p);
  }
  .heart{font-size:68px;display:inline-block}
  #surprise{display:none;margin-top:16px}
  .btn{
    margin-top:16px;display:inline-block;
    padding:10px 16px;border-radius:10px;
    background:rgba(255,255,255,0.08);
    color:var(--p);text-decoration:none;font-weight:600;
    cursor:pointer;
  }
</style>
</head>
